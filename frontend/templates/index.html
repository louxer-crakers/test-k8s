<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0f172a;
            --primary-hover: #334155;
            --code-bg: #f1f5f9;
            --success: #15803d;
            --danger: #b91c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 24px 16px;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        .badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--code-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (min-width: 640px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
        }
        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .code-block {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
            background: var(--code-bg);
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            word-break: break-all;
            display: block;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }
        .status-row:last-child { border-bottom: none; }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        button, .btn {
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.875rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border-color: var(--border);
        }
        .btn-secondary:hover { background: var(--code-bg); }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            background: #ffffff;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        .list {
            list-style: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            max-height: 240px;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }
        .list-item:last-child { border-bottom: none; }
        .status-ok { color: var(--success); font-weight: 600; }
        .status-err { color: var(--danger); font-weight: 600; }
        .status-wait { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>{{ app_name }}</h1>
            </div>
            <div>
                <span class="badge">pod: {{ host }}</span>
            </div>
        </header>

        <div class="grid">
            <div class="panel">
                <div class="panel-title">Target Public Backend URL</div>
                <div class="code-block" id="backendUrlDisplay">{{ backend_url }}</div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">
                    Configured via BACKEND_PUBLIC_URL environment variable.
                </p>
            </div>

            <div class="panel">
                <div class="panel-title">Network Diagnostics</div>
                <div class="status-row">
                    <span>Browser to Backend (Client-side):</span>
                    <span id="clientStatus" class="status-wait">pending</span>
                </div>
                <div class="status-row">
                    <span>Frontend Pod to Backend (Server-side):</span>
                    <span id="serverStatus" class="status-wait">pending</span>
                </div>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="checkClient()">Test Client</button>
                    <button class="btn-secondary" onclick="checkServer()">Test Server</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Backend Messages Store</div>
            <form onsubmit="postMessage(event)">
                <input type="text" id="msgInput" placeholder="Enter message text..." required>
                <button type="submit" id="btnSubmit">Submit</button>
            </form>

            <ul class="list" id="messagesList">
                <li class="list-item" style="color: var(--text-muted);">Loading messages...</li>
            </ul>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 0.75rem; color: var(--text-muted);">
                <span id="backendPod">-</span>
                <button class="btn-secondary" style="font-size: 0.75rem; padding: 3px 8px;" onclick="loadMessages()">Refresh</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "{{ backend_url }}";

        async function checkClient() {
            const el = document.getElementById("clientStatus");
            el.className = "status-wait";
            el.innerText = "checking...";
            const start = performance.now();
            try {
                const res = await fetch(`${BACKEND_URL}/healthz`);
                const ms = Math.round(performance.now() - start);
                if (res.ok) {
                    const data = await res.json();
                    el.className = "status-ok";
                    el.innerText = `connected (${ms}ms, pod: ${data.host})`;
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (err) {
                el.className = "status-err";
                el.innerText = `failed (${err.message})`;
            }
        }

        async function checkServer() {
            const el = document.getElementById("serverStatus");
            el.className = "status-wait";
            el.innerText = "checking...";
            try {
                const res = await fetch("/api/ping-backend");
                const data = await res.json();
                if (res.ok && data.status === "success") {
                    el.className = "status-ok";
                    el.innerText = `connected (pod: ${data.payload.host})`;
                } else {
                    el.className = "status-err";
                    el.innerText = data.error || "failed";
                }
            } catch (err) {
                el.className = "status-err";
                el.innerText = "request error";
            }
        }

        async function loadMessages() {
            const list = document.getElementById("messagesList");
            const podEl = document.getElementById("backendPod");
            try {
                const res = await fetch(`${BACKEND_URL}/api/messages`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                podEl.innerText = `served by backend pod: ${json.host}`;

                if (!json.data || json.data.length === 0) {
                    list.innerHTML = `<li class="list-item" style="color: var(--text-muted);">No records found.</li>`;
                    return;
                }

                list.innerHTML = json.data.map(item => `
                    <li class="list-item">
                        <span>${escapeHtml(item.text)}</span>
                        <span class="badge">#${item.id}</span>
                    </li>
                `).join("");
            } catch (err) {
                list.innerHTML = `<li class="list-item" style="color: var(--danger);">Failed to load messages from ${BACKEND_URL}: ${err.message}</li>`;
            }
        }

        async function postMessage(e) {
            e.preventDefault();
            const input = document.getElementById("msgInput");
            const btn = document.getElementById("btnSubmit");
            const val = input.value.trim();
            if (!val) return;

            btn.disabled = true;
            try {
                const res = await fetch(`${BACKEND_URL}/api/messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: val })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                input.value = "";
                await loadMessages();
            } catch (err) {
                alert(`Error posting to backend: ${err.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.innerText = str;
            return d.innerHTML;
        }

        window.addEventListener("DOMContentLoaded", () => {
            checkClient();
            checkServer();
            loadMessages();
        });
    </script>
</body>
</html>
